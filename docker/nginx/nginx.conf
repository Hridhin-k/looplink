# =============================================================================
# Badger — nginx reverse proxy
# =============================================================================
#
# Role
#   Terminate TLS at the edge, then reverse-proxy all HTTP and WebSocket
#   traffic to the Badger server (single upstream on TCP 8080).
#
# Hostnames
#   badger.dev        — apex (health, ACME, optional admin)
#   *.badger.dev      — wildcard tunnel hosts (HTTP forwarding by Host slug)
#
# Let's Encrypt
#   - HTTP-01: served from /.well-known/acme-challenge/ on port 80 (apex + wildcard
#     names that answer on this box). Enough for the apex certificate.
#   - Wildcard (*.badger.dev) REQUIRES DNS-01 (HTTP-01 cannot prove wildcards).
#     Issue with certbot + a DNS plugin, e.g.:
#       certbot certonly --dns-<provider> -d badger.dev -d '*.badger.dev'
#   - Paths below match certbot's default live layout. Replace the domain
#     segment if your certificate name differs.
#
# Upstream
#   Defaults to 127.0.0.1:8080 for a host-installed Badger server.
#   Under Docker Compose, change the upstream to `server:8080` (service name).
#
# =============================================================================

# worker_processes — number of nginx worker OS processes.
#   `auto` sizes to the available CPU count so one core is not left idle and
#   we do not oversubscribe on small VMs.
worker_processes auto;

# error_log — where nginx writes operational and error messages.
#   `warn` keeps routine access noise out while still recording TLS and proxy
#   failures that matter in production.
error_log /var/log/nginx/error.log warn;

# pid — filesystem path of the master process PID file.
#   Used by `nginx -s reload|quit` and process supervisors.
pid /var/run/nginx.pid;

# events — connection-handling settings for every worker.
events {
    # worker_connections — max simultaneous connections per worker.
    #   Includes client sockets and upstream sockets to Badger. 1024 is a
    #   sane default for a single-server edge box; raise if you see 503s under
    #   load and have headroom (ulimit -n).
    worker_connections 1024;

    # multi_accept — whether a worker accepts many connections in one go.
    #   `on` reduces latency spikes when many clients connect at once.
    multi_accept on;
}

# http — HTTP/HTTPS virtual server configuration.
http {
    # include — load MIME type → Content-Type mappings shipped with nginx.
    include /etc/nginx/mime.types;

    # default_type — Content-Type when no MIME mapping matches.
    #   Binary-safe default so unknown tunnel payloads are not labelled as HTML.
    default_type application/octet-stream;

    # log_format — named access-log template.
    #   Captures host (tunnel slug), upstream timing, and upgrade headers so
    #   WebSocket vs plain HTTP is visible when debugging.
    log_format badger '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        'host=$host '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time" '
                        'upgrade="$http_upgrade" '
                        '"$http_user_agent"';

    # access_log — write one access line per request using the template above.
    access_log /var/log/nginx/access.log badger;

    # sendfile — use the kernel sendfile(2) path for static files (ACME, errors).
    #   Avoids extra userspace copies; irrelevant for proxied tunnel bodies but
    #   harmless and recommended as a global default.
    sendfile on;

    # tcp_nopush — with sendfile, send headers and the first file chunk together.
    #   Slightly fewer packets on static ACME responses.
    tcp_nopush on;

    # tcp_nodelay — disable Nagle on keep-alive and WebSocket sockets.
    #   Small control-plane frames (PING/PONG, HTTP chunk headers) must not wait
    #   to be coalesced.
    tcp_nodelay on;

    # keepalive_timeout — how long an idle client keep-alive stays open.
    #   65s is nginx's common default; long enough for browsers, short enough
    #   to release worker_connections on quiet tunnel hosts.
    keepalive_timeout 65s;

    # types_hash_max_size — size of the MIME types hash table.
    #   Prevents "could not build the types_hash" warnings on some distros.
    types_hash_max_size 2048;

    # server_tokens — omit the nginx version from Server headers and error pages.
    #   Reduces information leakage to scanners.
    server_tokens off;

    # client_max_body_size — max upload body accepted from a public client.
    #   Forwarded to the CLI's local service; 50m covers typical API uploads
    #   without unbounded memory risk. Raise per-deployment if needed.
    client_max_body_size 50m;

    # proxy_buffers / proxy_buffer_size — buffering of upstream response headers
    #   and early body. Sized for verbose tunnel responses without spilling to
    #   disk on every request.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # ---------------------------------------------------------------------------
    # WebSocket upgrade helper
    # ---------------------------------------------------------------------------
    #
    # map — derive Connection from the client's Upgrade header.
    #   When Upgrade is present → "upgrade" (complete the WebSocket handshake).
    #   When Upgrade is empty   → "close"   (normal HTTP reverse proxy).
    #   Without this, browsers and the Badger CLI cannot establish `wss://`.
    map $http_upgrade $connection_upgrade {
        # default — Upgrade header present (any non-empty value).
        default upgrade;

        # '' — no Upgrade header (plain HTTP / HTTP forwarding).
        '' close;
    }

    # ---------------------------------------------------------------------------
    # Upstream — Badger NestJS / Fastify process
    # ---------------------------------------------------------------------------
    #
    # upstream — named pool of backends. One server today; add peers later for HA.
    upstream badger_server {
        # server — backend address:port.
        #   Host install: 127.0.0.1:8080
        #   Docker Compose on network `badger`: server:8080
        server 127.0.0.1:8080;

        # keepalive — cache idle TCP connections to the upstream.
        #   Reuses sockets for HTTP forwarding and short WS reconnect races.
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # Shared proxy settings (applied inside location blocks via include pattern
    # inlined below so this single file stays self-contained).
    # ---------------------------------------------------------------------------

    # ===========================================================================
    # Port 80 — ACME HTTP-01 + HTTPS redirect
    # ===========================================================================
    server {
        # listen — accept cleartext HTTP on all IPv4 interfaces, port 80.
        #   Let's Encrypt HTTP-01 and first-time visitors land here.
        listen 80;

        # listen — same for IPv6.
        listen [::]:80;

        # server_name — hosts this block answers for.
        #   Apex + wildcard so every tunnel subdomain shares the ACME path and
        #   redirect behaviour. Replace `badger.dev` if you use another domain.
        server_name badger.dev *.badger.dev;

        # location ^~ /.well-known/acme-challenge/ — certbot / acme.sh webroot.
        #   `^~` stops regex locations from stealing the prefix. Files are read
        #   from the webroot certbot writes during `certonly --webroot`.
        location ^~ /.well-known/acme-challenge/ {
            # root — filesystem prefix for ACME challenge files.
            #   Challenge URL /.well-known/acme-challenge/TOKEN maps to
            #   /var/www/certbot/.well-known/acme-challenge/TOKEN.
            root /var/www/certbot;

            # default_type — ACME tokens are plain text.
            default_type text/plain;

            # allow / deny — optional IP allow-list omitted so any CA can reach us.
            # try_files — serve the token file or 404 (do not fall through to proxy).
            try_files $uri =404;
        }

        # location / — everything else on :80.
        #   Redirect to HTTPS so tunnel URLs and the CLI always use TLS in prod.
        #   Comment this block out only while bootstrapping certificates.
        location / {
            # return — permanent redirect to the HTTPS equivalent.
            #   `$host` preserves the tunnel subdomain; `$request_uri` keeps
            #   path and query string intact for HTTP forwarding clients.
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================================================
    # Port 443 — TLS termination, wildcard tunnels, WebSocket, HTTP forward
    # ===========================================================================
    server {
        # listen — HTTPS on IPv4.
        #   `ssl` enables TLS termination for this socket.
        listen 443 ssl;

        # listen — HTTPS on IPv6.
        listen [::]:443 ssl;

        # http2 — multiplex many streams on one TLS connection (nginx ≥ 1.25.1).
        #   On older nginx replace the two listen lines with
        #   `listen 443 ssl http2;` / `listen [::]:443 ssl http2;` and remove this.
        http2 on;

        # server_name — apex + wildcard tunnel hosts.
        server_name badger.dev *.badger.dev;

        # -----------------------------------------------------------------------
        # TLS — Let's Encrypt certificate paths (certbot defaults)
        # -----------------------------------------------------------------------

        # ssl_certificate — full chain (leaf + intermediates) presented to clients.
        #   Wildcard + apex typically live under the same lineage directory when
        #   issued together with `-d badger.dev -d '*.badger.dev'`.
        ssl_certificate /etc/letsencrypt/live/badger.dev/fullchain.pem;

        # ssl_certificate_key — private key matching ssl_certificate.
        #   Mode 600; readable by the nginx master (root) then workers.
        ssl_certificate_key /etc/letsencrypt/live/badger.dev/privkey.pem;

        # ssl_trusted_certificate — chain used for OCSP stapling verification.
        #   Same fullchain is correct for Let's Encrypt.
        ssl_trusted_certificate /etc/letsencrypt/live/badger.dev/fullchain.pem;

        # ssl_protocols — allowed TLS versions.
        #   TLS 1.2 + 1.3 only; legacy 1.0/1.1 are disabled.
        ssl_protocols TLSv1.2 TLSv1.3;

        # ssl_ciphers — cipher suites for TLS 1.2 (TLS 1.3 has its own set).
        #   Mozilla intermediate profile: broad client support without weak ciphers.
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

        # ssl_prefer_server_ciphers — for TLS 1.2, prefer the server cipher order.
        #   Off for TLS 1.3-centric configs is also fine; `off` lets modern
        #   clients pick; we keep `on` for predictable 1.2 behaviour.
        ssl_prefer_server_ciphers on;

        # ssl_session_cache — shared TLS session cache across workers.
        #   Speeds up reconnects from browsers and the CLI after brief drops.
        ssl_session_cache shared:SSL:10m;

        # ssl_session_timeout — how long a cached TLS session remains reusable.
        ssl_session_timeout 1d;

        # ssl_session_tickets — session ticket key rotation is operationally
        #   harder on multi-node edges; disable for simpler forward secrecy ops.
        ssl_session_tickets off;

        # ssl_stapling — attach a cached OCSP response to the TLS handshake.
        #   Saves clients an extra round-trip to the CA.
        ssl_stapling on;

        # ssl_stapling_verify — verify the OCSP response before stapling it.
        ssl_stapling_verify on;

        # resolver — DNS resolver used for OCSP responder lookups (and any
        #   variables that need runtime DNS). Cloudflare + Google public DNS.
        resolver 1.1.1.1 8.8.8.8 valid=300s;

        # resolver_timeout — max wait for the resolver above.
        resolver_timeout 5s;

        # add_header Strict-Transport-Security — HSTS: browsers must use HTTPS.
        #   `max-age=31536000` = 1 year. `includeSubDomains` covers *.badger.dev.
        #   Enable `preload` only after you intentionally submit to the HSTS list.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # -----------------------------------------------------------------------
        # ACME on HTTPS (some clients renew over 443)
        # -----------------------------------------------------------------------
        location ^~ /.well-known/acme-challenge/ {
            # root — same webroot as the :80 block so either port can answer.
            root /var/www/certbot;

            # default_type — plain text challenge body.
            default_type text/plain;

            # try_files — do not proxy missing tokens to Badger.
            try_files $uri =404;
        }

        # -----------------------------------------------------------------------
        # Health — optional edge probe that still hits the app
        # -----------------------------------------------------------------------
        location = /health {
            # proxy_pass — forward to the Badger upstream health endpoint.
            #   Trailing URI form without path appends the original URI (/health).
            proxy_pass http://badger_server;

            # proxy_http_version — HTTP/1.1 required for upstream keepalive.
            proxy_http_version 1.1;

            # proxy_set_header Connection — empty clears hop-by-hop Connection
            #   so keepalive to the upstream works for plain HTTP.
            proxy_set_header Connection "";

            # proxy_set_header Host — preserve the public Host (or health checks
            #   may use the upstream name). Badger /health does not need a
            #   tunnel slug, but keeping Host is consistent.
            proxy_set_header Host $host;

            # access_log — disable access logging for noisy probes (optional).
            access_log off;
        }

        # -----------------------------------------------------------------------
        # Catch-all — HTTP forwarding + WebSocket control plane
        # -----------------------------------------------------------------------
        #
        # One location serves both:
        #   1) Public HTTP(S) to https://{slug}.badger.dev/...  (tunnel forward)
        #   2) CLI WebSocket to wss://badger.dev/ or wss://*.badger.dev/
        #
        # Badger selects tunnels by the Host header slug; nginx must NOT
        # rewrite Host to the upstream name.
        location / {
            # proxy_pass — send the request to the Badger NestJS server.
            proxy_pass http://badger_server;

            # proxy_http_version — 1.1 is mandatory for WebSocket Upgrade and
            #   for upstream keepalive connections.
            proxy_http_version 1.1;

            # proxy_set_header Upgrade — forward the client's Upgrade header
            #   (usually "websocket") so Fastify/`ws` can complete the handshake.
            proxy_set_header Upgrade $http_upgrade;

            # proxy_set_header Connection — see map $connection_upgrade above.
            #   "upgrade" for WebSocket, "close" for ordinary HTTP forwarding.
            proxy_set_header Connection $connection_upgrade;

            # proxy_set_header Host — CRITICAL for Badger.
            #   Pass the original public Host (`abc12345.badger.dev`) so
            #   extractTunnelSlugFromHost can resolve the tunnel. Never replace
            #   this with $proxy_host or the upstream literal.
            proxy_set_header Host $host;

            # proxy_set_header X-Real-IP — originating client address.
            proxy_set_header X-Real-IP $remote_addr;

            # proxy_set_header X-Forwarded-For — append client to the chain.
            #   `$proxy_add_x_forwarded_for` preserves any prior proxies.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # proxy_set_header X-Forwarded-Proto — scheme the client used.
            #   Always `https` on this server block so apps generate correct URLs.
            proxy_set_header X-Forwarded-Proto $scheme;

            # proxy_set_header X-Forwarded-Host — original Host for apps that
            #   prefer this over rewriting Host (Badger uses Host directly).
            proxy_set_header X-Forwarded-Host $host;

            # proxy_set_header X-Forwarded-Port — public port (443).
            proxy_set_header X-Forwarded-Port $server_port;

            # proxy_connect_timeout — max time to establish TCP to Badger.
            proxy_connect_timeout 10s;

            # proxy_send_timeout — max time between successive client→upstream
            #   write success. Covers large request bodies into a tunnel.
            proxy_send_timeout 60s;

            # proxy_read_timeout — max time between successive upstream reads.
            #   Must exceed Badger's HTTP forward timeout (default 30s) and
            #   stay high for WebSocket idle gaps between heartbeats (CLI pings
            #   every 30s; server allows 60s). 90s leaves margin for both.
            proxy_read_timeout 90s;

            # proxy_buffering — buffer upstream response before sending client.
            #   `off` streams tunnel responses (and WS frames) immediately so
            #   SSE-like and chunked bodies are not delayed.
            proxy_buffering off;

            # proxy_request_buffering — buffer the full client body before proxy.
            #   `off` streams uploads to Badger / the local app as they arrive.
            proxy_request_buffering off;

            # chunked_transfer_encoding — allow chunked bodies from clients.
            chunked_transfer_encoding on;

            # proxy_redirect — disable absolute Location rewriting.
            #   Tunnel apps may emit their own redirects; leave them untouched.
            #   Upstream Set-Cookie and cache headers are forwarded as-is.
            proxy_redirect off;
        }
    }
}
