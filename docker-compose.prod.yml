# Production overlay.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  server:
    build:
      target: production
    image: looplink-server:${LOOPLINK_IMAGE_TAG:-latest}
    env_file:
      - docker/production.env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Cap the process so a runaway forward cannot starve the host.
    deploy:
      resources:
        limits:
          memory: 512M
