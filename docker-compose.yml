# Shared Badger server definition.
#
# Development:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Production:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Ports (see docker/README.md for the full table):
#   8080/tcp — HTTP + WebSocket + public tunnel forwarding (single Fastify listener)

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: badger-server:local
    container_name: badger-server
    ports:
      # Host:container — both sides default to 8080; override host with PORT.
      - "${PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||'8080')+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - badger

networks:
  badger:
    name: badger
    driver: bridge
